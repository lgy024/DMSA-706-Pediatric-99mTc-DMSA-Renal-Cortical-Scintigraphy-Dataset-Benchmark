base: base.yaml

model:
  name: internvl25
  pretrained: OpenGVLab/InternVL2_5-8B
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  epochs: 3
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-5
  save_dir: outputs/checkpoints/internvl25
