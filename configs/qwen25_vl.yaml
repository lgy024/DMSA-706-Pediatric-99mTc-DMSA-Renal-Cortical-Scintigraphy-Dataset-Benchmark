base: base.yaml

model:
  name: qwen25_vl
  pretrained: Qwen/Qwen2.5-VL-7B-Instruct
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj]

train:
  epochs: 3
  batch_size: 2
  grad_accum: 8
  lr: 2.0e-5
  save_dir: outputs/checkpoints/qwen25_vl
